name: 构建 Windows 桌面版

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  LIBREOFFICE_VERSION: "26.2.6"
  LIBREOFFICE_INSTALLER_URL: "https://download.documentfoundation.org/libreoffice/stable/26.2.6/win/x86_64/LibreOffice_26.2.6_Win_x86-64.msi"
  LIBREOFFICE_INSTALLER_SHA256: "f9877032fd908beb9c0ddf06df4af5c2e85f419c42e14876c4cce5aae5fb2660"
  RELEASE_ROOT: "release"

jobs:
  build-windows-desktop:
    name: Windows x64 便携版
    runs-on: windows-2022
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 获取源代码
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "审核器/requirements-desktop.lock"

      - name: 安装锁定依赖
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r ".\审核器\requirements-desktop.lock"
          python -m pip install --disable-pip-version-check --no-deps ".\审核器"

      - name: 运行桌面版测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest ".\审核器\tests\desktop" -q

      - name: 下载并安装 LibreOffice
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP "LibreOffice_$env:LIBREOFFICE_VERSION`_Win_x86-64.msi"
          $installLogPath = Join-Path $env:RUNNER_TEMP "libreoffice-install.log"

          Invoke-WebRequest -Uri $env:LIBREOFFICE_INSTALLER_URL -OutFile $installerPath

          # 固定官方安装包摘要，防止镜像异常或上游文件被替换。
          $actualHash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LIBREOFFICE_INSTALLER_SHA256) {
            throw "LibreOffice 安装包 SHA-256 不匹配：$actualHash"
          }

          # 安装只发生在一次性 CI 虚拟机中，最终用户仍然直接运行便携版 EXE。
          $installerArguments = @(
            "/i",
            "`"$installerPath`"",
            "/qn",
            "/norestart",
            "/L*v",
            "`"$installLogPath`"",
            "REGISTER_ALL_MSO_TYPES=0",
            "ISCHECKFORPRODUCTUPDATES=0",
            "QUICKSTART=0"
          )
          $installProcess = Start-Process -FilePath "msiexec.exe" -ArgumentList $installerArguments -Wait -PassThru
          if ($installProcess.ExitCode -notin @(0, 3010)) {
            Get-Content -Path $installLogPath -Tail 200
            throw "LibreOffice 安装失败，退出码：$($installProcess.ExitCode)"
          }

          $libreOfficeRoot = Join-Path $env:ProgramFiles "LibreOffice"
          $sofficePath = Join-Path $libreOfficeRoot "program\soffice.exe"
          if (-not (Test-Path -LiteralPath $sofficePath -PathType Leaf)) {
            throw "LibreOffice 运行文件缺失：$sofficePath"
          }

          # Windows 安装集把英文许可说明放在 readmes 目录，不在安装根目录。
          $licenseSource = Join-Path $libreOfficeRoot "readmes\readme_en-US.txt"
          if (-not (Test-Path -LiteralPath $licenseSource -PathType Leaf)) {
            throw "LibreOffice 许可文件缺失：$licenseSource"
          }
          $licensesRoot = Join-Path $env:RUNNER_TEMP "licenses"
          New-Item -ItemType Directory -Path $licensesRoot -Force | Out-Null
          Copy-Item -LiteralPath $licenseSource -Destination (Join-Path $licensesRoot "LibreOffice.txt")

          "LIBREOFFICE_ROOT=$libreOfficeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LICENSES_ROOT=$licensesRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 构建便携版
        run: |
          python ".\审核器\tools\build_windows_desktop.py" `
            --libreoffice "$env:LIBREOFFICE_ROOT" `
            --licenses "$env:LICENSES_ROOT" `
            --output ".\$env:RELEASE_ROOT"

      - name: 验证便携版
        run: |
          $distributionPath = ".\$env:RELEASE_ROOT\风控矩阵审核器-v2.0.0"
          $archivePath = ".\$env:RELEASE_ROOT\风控矩阵审核器-v2.0.0-Windows-x64.zip"
          python ".\审核器\tools\verify_portable_distribution.py" $distributionPath --zip $archivePath

          # 在运行摘要中给出最终 ZIP 哈希，下载后可人工复核。
          $archiveHash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "### Windows 便携版" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- 文件：``风控矩阵审核器-v2.0.0-Windows-x64.zip``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- SHA-256：``$archiveHash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: 上传 Windows 便携版
        uses: actions/upload-artifact@v7
        with:
          path: "release/风控矩阵审核器-v2.0.0-Windows-x64.zip"
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          archive: false
