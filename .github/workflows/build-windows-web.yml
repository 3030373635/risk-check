name: 构建 Windows 离线 Web 便携版

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHON_RUNTIME_SHA256: "f86b3cbd425e1c446b56aa24e20a7be1223c1a8146e5e3a68c8e18d08b76e810"
  LIBREOFFICE_VERSION: "26.2.6"
  LIBREOFFICE_INSTALLER_URL: "https://download.documentfoundation.org/libreoffice/stable/26.2.6/win/x86_64/LibreOffice_26.2.6_Win_x86-64.msi"
  LIBREOFFICE_INSTALLER_SHA256: "f9877032fd908beb9c0ddf06df4af5c2e85f419c42e14876c4cce5aae5fb2660"
  RELEASE_ROOT: "release"

jobs:
  build-windows-web:
    name: Windows x64 离线 Web 便携版
    runs-on: windows-2022
    timeout-minutes: 90

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 获取源代码
        uses: actions/checkout@v7

      - name: 配置构建 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "risk-audit/pyproject.toml"

      - name: 安装构建与测试依赖
        run: python -m pip install --disable-pip-version-check ".\risk-audit[web,test]"

      - name: 验证锁定运行时和安装策略
        run: |
          $manifest = Get-Content ".\risk-audit\packaging\runtime-sources.json" -Raw | ConvertFrom-Json
          if ($manifest.platforms.'windows-x64'.python.sha256 -ne $env:PYTHON_RUNTIME_SHA256) {
            throw "runtime-sources.json 的 Windows Python SHA-256 与 CI 锁定值不一致"
          }
          if (-not (Select-String -Path ".\risk-audit\tools\portable_release.py" -SimpleMatch '"--require-hashes"')) {
            throw "目标 Python 安装未强制 --require-hashes"
          }
          if (-not (Test-Path ".\risk-audit\requirements-runtime.lock" -PathType Leaf)) {
            throw "缺少纯运行依赖锁 requirements-runtime.lock"
          }

      - name: 验证 Web 静态资产
        run: python ".\risk-audit\tools\vendor_web_assets.py" --verify

      - name: 运行 Web 版测试
        working-directory: risk-audit
        run: python -m pytest "tests\web" -q

      - name: 下载并安装 LibreOffice
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP "LibreOffice_$env:LIBREOFFICE_VERSION`_Win_x86-64.msi"
          $installLogPath = Join-Path $env:RUNNER_TEMP "libreoffice-install.log"
          Invoke-WebRequest -Uri $env:LIBREOFFICE_INSTALLER_URL -OutFile $installerPath

          # 固定官方安装包摘要，防止下载内容在构建时被替换。
          $actualHash = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LIBREOFFICE_INSTALLER_SHA256) {
            throw "LibreOffice 安装包 SHA-256 不匹配：$actualHash"
          }

          $installerArguments = @(
            "/i", "`"$installerPath`"", "/qn", "/norestart", "/L*v", "`"$installLogPath`"",
            "REGISTER_ALL_MSO_TYPES=0", "ISCHECKFORPRODUCTUPDATES=0", "QUICKSTART=0"
          )
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $installerArguments -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            Get-Content -Path $installLogPath -Tail 200
            throw "LibreOffice 安装失败，退出码：$($process.ExitCode)"
          }
          $libreOfficeRoot = Join-Path $env:ProgramFiles "LibreOffice"
          if (-not (Test-Path (Join-Path $libreOfficeRoot "program\soffice.exe") -PathType Leaf)) {
            throw "LibreOffice 运行文件缺失"
          }
          "LIBREOFFICE_ROOT=$libreOfficeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 定位官方 VC++ x64 应用本地运行库
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere -PathType Leaf)) {
            throw "Visual Studio vswhere.exe 缺失"
          }
          $visualStudioRoot = & $vswhere -latest -products * -property installationPath
          if (-not $visualStudioRoot) {
            throw "未找到 Visual Studio 安装目录"
          }
          $redistRoot = Join-Path $visualStudioRoot "VC\Redist\MSVC"
          $vcRuntimeRoot = Get-ChildItem -Path $redistRoot -Directory |
            Sort-Object -Property Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" } |
            Where-Object { Test-Path (Join-Path $_ "msvcp140.dll") -PathType Leaf } |
            Select-Object -First 1
          if (-not $vcRuntimeRoot) {
            throw "Microsoft.VC143.CRT x64 运行库缺失：$redistRoot"
          }
          foreach ($dllName in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            if (-not (Test-Path (Join-Path $vcRuntimeRoot $dllName) -PathType Leaf)) {
              throw "VC++ x64 运行库文件缺失：$dllName"
            }
          }
          "VC_RUNTIME_ROOT=$vcRuntimeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 构建离线便携版
        run: |
          python ".\risk-audit\tools\build_portable.py" `
            --platform windows-x64 `
            --project-root "." `
            --libreoffice "$env:LIBREOFFICE_ROOT" `
            --vc-runtime "$env:VC_RUNTIME_ROOT" `
            --licenses ".\risk-audit\licenses" `
            --usage-guide ".\risk-audit\Windows Web版使用说明.md" `
            --output ".\$env:RELEASE_ROOT\风控矩阵审核器-v2.0.0"

      - name: 验证包内 LibreOffice 启动与 XLS 转换
        run: |
          $distributionRoot = Resolve-Path ".\$env:RELEASE_ROOT\风控矩阵审核器-v2.0.0"
          $soffice = Join-Path $distributionRoot "runtime\libreoffice\program\soffice.com"
          if (-not (Test-Path $soffice -PathType Leaf)) {
            throw "包内 LibreOffice 命令行入口缺失：$soffice"
          }

          $versionOutput = & $soffice --headless --version 2>&1
          $versionExitCode = $LASTEXITCODE
          $versionOutput | Write-Host
          if ($versionExitCode -ne 0) {
            throw "包内 LibreOffice 启动失败，退出码：$versionExitCode"
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP "risk-audit-libreoffice-smoke"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          $profileRoot = Join-Path $smokeRoot "profile"
          New-Item -ItemType Directory -Path $profileRoot -Force | Out-Null
          $profileUri = ([System.Uri]::new($profileRoot)).AbsoluteUri
          $sourcePath = Join-Path $distributionRoot "runtime\resources\baselines\templates\第一批省公司通用版本整合0818\第一批省公司通用版本整合9.4\09 职工福利保障与薪酬管理\09风控矩阵-职工福利保障与薪酬管理-省公司（审定）8.13.xls"
          $stagedSource = Join-Path $smokeRoot "baseline.xls"
          Copy-Item -Path $sourcePath -Destination $stagedSource
          $conversionOutput = & $soffice "-env:UserInstallation=$profileUri" --headless --convert-to xlsx --outdir $smokeRoot $stagedSource 2>&1
          $conversionExitCode = $LASTEXITCODE
          $conversionOutput | Write-Host
          $convertedPath = Join-Path $smokeRoot "baseline.xlsx"
          if ($conversionExitCode -ne 0 -or -not (Test-Path $convertedPath -PathType Leaf)) {
            throw "包内 LibreOffice XLS 转换失败，退出码：$conversionExitCode"
          }

      - name: 验证最终归档
        run: |
          $archivePath = ".\$env:RELEASE_ROOT\风控矩阵审核器-v2.0.0-Windows-x64.zip"
          python ".\risk-audit\tools\verify_portable_distribution.py" $archivePath --platform windows-x64
          $archiveHash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "### Windows 离线 Web 便携版" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- SHA-256：``$archiveHash``" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: 上传 Windows 便携版
        uses: actions/upload-artifact@v7
        with:
          path: "release/风控矩阵审核器-v2.0.0-Windows-x64.zip"
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          archive: false
