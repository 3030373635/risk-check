name: 构建 macOS Apple Silicon 离线 Web 便携版

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHON_RUNTIME_SHA256: "e1d745b07b6acc0641dbb3237d3c5953deeeed182141bab2242684076fd86547"
  LIBREOFFICE_VERSION: "25.2.6.2"
  LIBREOFFICE_DMG_URL: "https://downloadarchive.documentfoundation.org/libreoffice/old/25.2.6.2/mac/aarch64/LibreOffice_25.2.6.2_MacOS_aarch64.dmg"
  LIBREOFFICE_DMG_SHA256: "b1c4b78fdaea8bd42461ad3bee264d5d281827dfcfdc1a567c64bc512ccde8b3"
  RELEASE_ROOT: "release"

jobs:
  build-macos-web:
    name: macOS Apple Silicon 离线 Web 便携版
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: 获取源代码
        uses: actions/checkout@v7

      - name: 验证 Apple Silicon runner
        shell: bash
        run: |
          [[ "$(uname -s)" == "Darwin" ]]
          [[ "$(uname -m)" == "arm64" ]]

      - name: 配置构建 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "审核器/pyproject.toml"

      - name: 创建项目环境并安装构建依赖
        shell: bash
        run: |
          python -m venv "审核器/.venv"
          "审核器/.venv/bin/python" -m pip install --disable-pip-version-check -e "审核器[web,test]"

      - name: 验证锁定运行时来源
        shell: bash
        run: |
          "审核器/.venv/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("审核器/packaging/runtime-sources.json").read_text(encoding="utf-8"))
          sources = manifest["platforms"]["macos-arm64"]
          if sources["python"]["sha256"] != os.environ["PYTHON_RUNTIME_SHA256"]:
              raise SystemExit("runtime-sources.json 的 macOS Python SHA-256 与 CI 锁定值不一致")
          if sources["libreoffice"]["version"] != os.environ["LIBREOFFICE_VERSION"]:
              raise SystemExit("runtime-sources.json 的 LibreOffice 版本与 CI 锁定值不一致")
          if sources["libreoffice"]["url"] != os.environ["LIBREOFFICE_DMG_URL"]:
              raise SystemExit("runtime-sources.json 的 LibreOffice URL 与 CI 锁定值不一致")
          if sources["libreoffice"]["sha256"] != os.environ["LIBREOFFICE_DMG_SHA256"]:
              raise SystemExit("runtime-sources.json 的 LibreOffice SHA-256 与 CI 锁定值不一致")
          PY
          test -f "审核器/requirements-runtime.lock"
          grep -Fq '"--require-hashes"' "审核器/tools/portable_release.py"

      - name: 验证 Web 静态资产
        shell: bash
        run: |
          "审核器/.venv/bin/python" "审核器/tools/vendor_web_assets.py" --verify

      - name: 运行 Web 版测试
        shell: bash
        run: |
          PYTHONPATH="审核器/src" "审核器/.venv/bin/python" -m pytest "审核器/tests/web" -q

      - name: 下载并校验 LibreOffice
        shell: bash
        run: |
          dmg_path="$RUNNER_TEMP/LibreOffice_25.2.6.2_MacOS_aarch64.dmg"
          curl --fail --location --retry 3 --output "$dmg_path" "$LIBREOFFICE_DMG_URL"

          # 固定官方 DMG 摘要，防止构建时使用被替换的应用包。
          actual_hash="$(shasum -a 256 "$dmg_path" | awk '{print $1}')"
          if [[ "$actual_hash" != "$LIBREOFFICE_DMG_SHA256" ]]; then
            echo "LibreOffice DMG SHA-256 不匹配：$actual_hash" >&2
            exit 1
          fi

      - name: 构建并验证 macOS 离线便携版
        shell: bash
        run: |
          dmg_path="$RUNNER_TEMP/LibreOffice_25.2.6.2_MacOS_aarch64.dmg"
          mount_point="$RUNNER_TEMP/libreoffice-mount"
          mkdir -p "$mount_point"

          # 无论构建是否成功，都卸载本次挂载的只读 DMG。
          cleanup_mount() {
            if mount | grep -Fq " on $mount_point "; then
              hdiutil detach "$mount_point" -force
            fi
          }
          trap cleanup_mount EXIT

          hdiutil attach "$dmg_path" -mountpoint "$mount_point" -nobrowse -readonly
          libreoffice_root="$mount_point/LibreOffice.app"
          test -x "$libreoffice_root/Contents/MacOS/soffice"
          codesign --verify --deep --strict "$libreoffice_root"
          lipo -archs "$libreoffice_root/Contents/MacOS/soffice" | grep -qw arm64

          chmod +x "审核器/tools/build_macos_portable.command"
          "审核器/tools/build_macos_portable.command" "$libreoffice_root"

          mkdir -p "$RELEASE_ROOT"
          /usr/bin/ditto --noextattr --noqtn --noacl \
            "dist/风控矩阵审核器-v2.0.0-macOS-arm64.zip" \
            "$RELEASE_ROOT/风控矩阵审核器-v2.0.0-macOS-arm64.zip"

          "审核器/.venv/bin/python" "审核器/tools/verify_portable_distribution.py" \
            "$RELEASE_ROOT/风控矩阵审核器-v2.0.0-macOS-arm64.zip" \
            --platform macos-arm64

      - name: 记录最终归档摘要
        shell: bash
        run: |
          archive_path="$RELEASE_ROOT/风控矩阵审核器-v2.0.0-macOS-arm64.zip"
          archive_hash="$(shasum -a 256 "$archive_path" | awk '{print $1}')"
          {
            echo "### macOS Apple Silicon 离线 Web 便携版"
            echo "- SHA-256：\`$archive_hash\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 macOS Apple Silicon 便携版
        uses: actions/upload-artifact@v7
        with:
          name: 风控矩阵审核器-v2.0.0-macOS-arm64
          path: "release/风控矩阵审核器-v2.0.0-macOS-arm64.zip"
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          archive: false
