[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-audit"
version = "2.0.0"
description = "完全离线的本机 Web 风控矩阵及三清单审核器"
requires-python = ">=3.11"
dependencies = [
  "openpyxl==3.1.5",
  "lxml==6.1.1",
  "python-docx==1.2.0",
  "xlrd==2.0.2",
  "jsonschema==4.25.1",
  "pypdf==6.10.2",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "httpx==0.28.1"]
web = ["fastapi==0.141.1", "uvicorn==0.53.0"]

[project.scripts]
risk-audit = "risk_audit.cli:main"
risk-audit-web = "risk_audit_web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
risk_audit_web = ["assets/*", "static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
